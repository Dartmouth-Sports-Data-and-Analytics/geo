<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ivy League Roster Construction: State Heat Maps</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="heatmaps.css?v=1" />
</head>
<body>
<header class="hm-header">
  <div class="hm-title">
    <a class="hm-back" href="index.html">&larr; Roster map</a>
    <h1>Ivy League Roster Construction <span>State heat maps</span></h1>
  </div>
  <div class="hm-controls">
    <label>Season <select id="yearSelect"></select></label>
    <label>Sport <select id="sportSelect"></select></label>
    <div class="seg" id="scaleToggle" role="group" aria-label="Color scale">
      <button data-scale="school" class="on">Each school's scale</button>
      <button data-scale="shared">Same scale for all</button>
    </div>
  </div>
</header>

<main id="grid"></main>
<div id="tip" role="tooltip"></div>
<div id="loading">Loading roster data&hellip;</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="heatmaps.js?v=2"></script>
</body>
</html>

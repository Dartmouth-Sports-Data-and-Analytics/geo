<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ivy League Roster Construction: State Heat Maps</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="heatmaps.css?v=4" />
</head>
<body>
<header class="hm-header">
  <div class="hm-title">
    <a class="hm-back" href="index.html">&larr; Roster map</a>
    <h1>Ivy League Roster Construction <span>State heat maps</span></h1>
  </div>
  <div class="hm-controls">
    <div class="menu" id="yearMenu">
      <button type="button" id="yearBtn" aria-haspopup="true">All seasons</button>
      <div class="menu-panel" id="yearPanel" hidden>
        <div class="menu-actions">
          <button type="button" class="link-btn" id="yearsAll">Select all</button>
          <button type="button" class="link-btn" id="yearsNone">Clear all</button>
        </div>
        <div class="menu-list" id="yearList"></div>
      </div>
    </div>
    <div class="menu" id="sportMenu">
      <button type="button" id="sportBtn" aria-haspopup="true">All sports</button>
      <div class="menu-panel" id="sportPanel" hidden>
        <div class="menu-actions">
          <button type="button" class="link-btn" id="sportsAll">Select all</button>
          <button type="button" class="link-btn" id="sportsNone">Clear all</button>
        </div>
        <div class="menu-list" id="sportList"></div>
      </div>
    </div>
  </div>
</header>

<div class="hm-regions" id="regionRow">
  <span class="hm-label">Regions</span>
  <div id="regionChips"></div>
  <button type="button" class="link-btn" id="regionsAll">Select all</button>
  <button type="button" class="link-btn" id="regionsNone">Clear all</button>
</div>

<main id="grid"></main>
<div id="tip" role="tooltip"></div>
<div id="loading">Loading roster data&hellip;</div>

<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="heatmaps.js?v=6"></script>
</body>
</html>

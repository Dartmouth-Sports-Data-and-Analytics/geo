<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ivy League Roster Construction</title>
<link rel="icon" href="data:," />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="style.css?v=7ff0cba8" />
</head>
<body>
<div id="app">
  <div id="map"></div>

  <div id="header">
    <h1>Ivy League Roster Construction</h1>
    <p><span id="count">0</span> players shown</p>
  </div>

  <div id="search">
    <input id="searchInput" type="search" placeholder="Find an athlete&hellip;" autocomplete="off" />
    <div id="searchResults"></div>
  </div>

  <button id="filterToggle">Filters</button>

  <a id="heatLink" href="heatmaps.html">State heat maps</a>

  <div id="schoolBar"></div>

  <div id="filterPanel">
    <div class="filter-section">
      <h3>Schools</h3>
      <div class="filter-actions spaced">
        <button class="link-btn" id="selectAllSchools">Select all</button>
        <button class="link-btn" id="clearAllSchools">Clear all</button>
      </div>
      <div class="school-grid" id="schoolGrid"></div>
    </div>

    <div class="filter-section">
      <h3>Years</h3>
      <div class="filter-actions spaced">
        <button class="link-btn" id="selectAllYears">Select all</button>
        <button class="link-btn" id="clearAllYears">Clear all</button>
      </div>
      <div class="chip-row" id="yearRow"></div>
    </div>

    <div class="filter-section" id="regionSection">
      <h3>Regions</h3>
      <div class="filter-actions spaced">
        <button class="link-btn" id="selectAllRegions">Select all</button>
        <button class="link-btn" id="clearAllRegions">Clear all</button>
      </div>
      <div class="chip-row" id="regionRow"></div>
    </div>

    <div class="filter-section">
      <h3>Map</h3>
      <label class="sport-row"><input type="checkbox" id="linesToggle"> Lines from campus</label>
      <div class="hint" id="linesHint"></div>
    </div>

    <div class="filter-section">
      <h3>Sports</h3>
      <div class="filter-actions">
        <button class="link-btn" id="selectAllSports">Select all</button>
        <button class="link-btn" id="clearAllSports">Clear all</button>
      </div>
      <div class="sport-list" id="sportList" style="margin-top:8px;"></div>
    </div>
  </div>

  <div id="loading">Loading roster data&hellip;</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="shared.js?v=a11e2ccf"></script>
<script src="app.js?v=350f153e"></script>
</body>
</html>
